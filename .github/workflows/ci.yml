name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-smoke:
    name: Package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    env:
      APE_PUBLIC_REQUIRE_FORBIDDEN_HASHES: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Disable automatic CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run bundle
      - name: Require fresh committed bundles
        run: git diff --exit-code -- dist/
      - run: npm run package:check
      - run: npm run package:reproducible
      - run: npm run public:check
      - run: npm run smoke:plugins
      - name: Focused package, MCP, and host integration tests
        run: npm run test:agent -- __tests__/runtime-v2-plugin-packages-public.test.js __tests__/runtime-v2-public-surface.test.js __tests__/runtime-v2-plugin-validation.test.js __tests__/runtime-v2-mcp.test.js

  full-suite:
    name: Full suite (Ubuntu, Node 22)
    needs: [package-smoke, marketplace-install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Validate prompt evaluation release gate
        run: npm run eval:prompts:check
      - run: npm test

  marketplace-install-smoke:
    name: Clean marketplace install (both hosts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Install pinned host CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.228
      - run: npm run package:check
      - run: npm run smoke:marketplaces
