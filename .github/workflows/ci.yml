name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-smoke:
    # Keep these display names stable because main branch protection keys its
    # required checks by the Node major, while setup-node uses exact pins.
    name: Package smoke (${{ matrix.os }}, Node ${{ matrix.node.major }})
    env:
      APE_PUBLIC_REQUIRE_FORBIDDEN_HASHES: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node:
          - version: 22.12.0
            major: 22
          - version: 24.15.0
            major: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Disable automatic CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node.version }}
          cache: npm
      - run: npm ci
      - run: npm run compatibility:check
      - run: npm run typecheck
      - run: npm run bundle
      - name: Require fresh committed bundles
        run: git diff --exit-code -- dist/
      - run: npm run package:check
      - run: npm run package:reproducible
      - run: npm run public:check
      - run: npm run smoke:plugins

  smoke:
    name: Test smoke set (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs smoke

  shard-1:
    name: Test shard 1 of 3 (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs shard 1 3

  shard-2:
    name: Test shard 2 of 3 (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs shard 2 3

  shard-3:
    name: Test shard 3 of 3 (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-ci-tests.mjs shard 3 3

  full-suite:
    name: Full suite aggregate
    needs: [package-smoke, marketplace-install-smoke, smoke, shard-1, shard-2, shard-3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Validate prompt evaluation release gate
        run: npm run eval:prompts:check
      - name: Replay operational failure canaries
        run: npm run operational:canary

  marketplace-install-smoke:
    name: Clean marketplace install (both hosts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run compatibility:check
      - name: Install pinned host CLIs
        run: npm install --global @openai/codex@0.147.0 @anthropic-ai/claude-code@2.1.228
      - run: npm run package:check
      - run: npm run smoke:marketplaces
