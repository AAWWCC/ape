name: Informational host edge compatibility

on:
  schedule:
    - cron: '43 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-edge:
    name: Current hosts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Disable automatic CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: node
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run compatibility:check
      - name: Install current host CLIs in this unprivileged job
        run: npm install --global @openai/codex@latest @anthropic-ai/claude-code@latest
      - name: Record current versions
        run: |
          node --version
          codex --version
          claude --version
      - name: Exercise clean marketplace installs without release authority
        run: npm run smoke:marketplaces -- --edge
